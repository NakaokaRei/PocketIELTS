name: iOS tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.device }} tests
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v7
      - name: Select hosted Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-${{ hashFiles('**/Package.resolved') }}
      - name: Resolve locked dependencies
        run: xcodebuild -resolvePackageDependencies -project PocketIELTS.xcodeproj -scheme PocketIELTS -derivedDataPath build -disableAutomaticPackageResolution
      - name: Install pinned LicensePlist
        run: |
          curl --fail --location --retry 3 https://github.com/mono0926/LicensePlist/releases/download/3.28.3/license-plist.zip -o "$RUNNER_TEMP/license-plist.zip"
          echo "5b5be263636889415b0dceca736f9ca8cf8f3ed23f80ed675a52c7ddd4842f06  $RUNNER_TEMP/license-plist.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/license-plist.zip" -d "$RUNNER_TEMP/license-plist"
      - name: Generate OSS acknowledgements
        env:
          LICENSE_PLIST_BIN: ${{ runner.temp }}/license-plist/license-plist
        run: Scripts/generate-licenses.sh build/SourcePackages
      - name: Unit and UI tests
        run: |
          set -o pipefail
          Scripts/ci-test.sh '${{ matrix.device }}' 'TestResults-${{ matrix.device }}.xcresult' | tee 'test-${{ matrix.device }}.log'
      - name: Upload test results and generated notices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.device }}
          path: |
            TestResults-*.xcresult
            test-*.log
            Resources/Licenses
          retention-days: 14
