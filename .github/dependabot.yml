version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      swift-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps(swift)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'deps(ci)'
